<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>2027 中歐旅行 App</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#697386;--line:#e5e9f0;--accent:#2457d6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.55}
header{background:#111827;color:#fff;padding:28px 18px 22px;position:sticky;top:0;z-index:5}header h1{font-size:22px;margin:0 0 5px}header p{margin:0;color:#cbd5e1;font-size:13px}
main{max-width:900px;margin:auto;padding:14px}.toolbar{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.toolbar a,.toolbar button{white-space:nowrap;border:0;border-radius:999px;background:#fff;color:var(--text);padding:9px 13px;text-decoration:none;box-shadow:0 1px 4px #00000012}
.card{background:var(--card);border-radius:16px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0000000b;border:1px solid var(--line)}
.day-head{display:flex;justify-content:space-between;gap:12px}.day-no{font-weight:800;color:var(--accent);font-size:13px}.date{color:var(--muted);font-size:13px}.day h2{font-size:19px;margin:3px 0}.city{color:var(--muted);font-size:13px}
.timeline{margin-top:14px}.row{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.time{font-weight:700;font-size:13px}.note{background:#f3f6fc;border-radius:10px;padding:10px;margin-top:12px;font-size:13px}
.flight,.hotel{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.flight:last-child,.hotel:last-child{border:0}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:15px;background:#fff;margin-bottom:10px}
section h2{font-size:18px;margin:0 0 10px}.muted{color:var(--muted);font-size:13px}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12px;padding:25px}
@media(min-width:700px){main{padding:22px}.day h2{font-size:21px}}
.photo{width:100%;height:190px;object-fit:cover;border-radius:13px;margin-top:13px;background:#e9edf5}
.photo-caption{font-size:12px;color:var(--muted);margin-top:5px}
.bilingual{font-weight:600}
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p></header>
<main>
  <div class="toolbar" id="nav"></div>
  <div class="card" style="padding:10px 14px"><strong>行程起點：</strong>2/3（三）＝ Day 1；Day 編號依 trip-data.js 日期順序自動產生。</div>
<input class="search" id="search" placeholder="搜尋景點、城市、交通、飯店…">
  <div id="app"></div>
</main>
<footer>行程資料與網頁程式分離：修改行程只需要編輯 trip-data.js，不要修改 index.html。</footer>
<script src="trip-data.js"></script>
<script>
const D=TRIP_DATA;
document.getElementById('title').textContent=D.title;
document.getElementById('subtitle').textContent=D.subtitle;

function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const IMAGE_MAP = {
  "2/3":"https://images.unsplash.com/photo-1540339832862-474599807836?auto=format&fit=crop&w=1200&q=80",
  "2/4":"https://images.unsplash.com/photo-1516550893923-42d6c1f0c7e9?auto=format&fit=crop&w=1200&q=80",
  "2/5":"https://images.unsplash.com/photo-1514890547357-a9ee288728e0?auto=format&fit=crop&w=1200&q=80",
  "2/6":"https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1200&q=80",
  "2/7":"https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=1200&q=80",
  "2/8":"https://images.unsplash.com/photo-1486911278844-a81c5267e227?auto=format&fit=crop&w=1200&q=80",
  "2/9":"https://images.unsplash.com/photo-1548919973-5cef591cdbc9?auto=format&fit=crop&w=1200&q=80",
  "2/10":"https://images.unsplash.com/photo-1506905925346-21bda4d32df4?auto=format&fit=crop&w=1200&q=80",
  "2/11":"https://images.unsplash.com/photo-1541849546-216549ae216d?auto=format&fit=crop&w=1200&q=80",
  "2/12":"https://images.unsplash.com/photo-1511739001486-6bfe10ce785f?auto=format&fit=crop&w=1200&q=80",
  "2/13":"https://images.unsplash.com/photo-1516550893923-42d6c1f0c7e9?auto=format&fit=crop&w=1200&q=80",
  "2/14":"https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1200&q=80",
  "2/15":"https://images.unsplash.com/photo-1522083165195-3424ed129620?auto=format&fit=crop&w=1200&q=80"
};
function photoFor(date,title){
  const url=IMAGE_MAP[date];
  if(!url) return '';
  const safeTitle=esc(title);
  return `<img class="photo" src="${url}" alt="${safeTitle}" loading="lazy"
    onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,${encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500"><rect width="1200" height="500" fill="#e9edf5"/><text x="600" y="240" text-anchor="middle" font-family="sans-serif" font-size="44" fill="#657084">'+safeTitle.replace(/'/g,'')+'</text><text x="600" y="300" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#8a94a6">Travel Photo</text></svg>'
    )}'">`;
}

function render(filter=''){
  const q=filter.trim().toLowerCase();
  const days=D.days.filter(d=>!q || JSON.stringify(d).toLowerCase().includes(q));
  let html='';
  html+=`<section class="card"><h2>✈️ 航班</h2>`;
  D.flights.forEach(f=>html+=`<div class="flight"><strong>${esc(f.date)}（${esc(f.weekday)}）</strong><div><strong>${esc(f.flight)}</strong>　${esc(f.time)}<br><span class="muted">${esc(f.route)}</span></div></div>`);
  html+=`</section>`;
  html+=`<section class="card"><h2>🏨 住宿</h2>`;
  D.hotels.forEach(h=>html+=`<div class="hotel"><strong>${esc(h.date)}</strong><div><strong>${esc(h.hotel)}</strong><br><span class="muted">${esc(h.city)}</span></div></div>`);
  html+=`</section>`;
  html+=`<section id="days">`;
  if(!days.length) html+=`<div class="card empty">沒有符合搜尋條件的行程。</div>`;
  days.forEach((d)=>{
    const n=D.days.indexOf(d)+1;
    html+=`<article class="card day" id="day-${n}">
      ${photoFor(d.date,d.title)}
      <div class="day-head"><div><div class="day-no">DAY ${n}</div><h2>${esc(d.title)}</h2><div class="city">${esc(d.city)}</div></div><div class="date">${esc(d.date)}（${esc(d.weekday)}）</div></div>
      <div class="timeline">${d.items.map(x=>`<div class="row"><div class="time">${esc(x[0])}</div><div>${esc(x[1])}</div></div>`).join('')}</div>
      <div class="note"><strong>注意：</strong>${esc(d.notes)}<br><span class="muted">住宿：${esc(d.hotel)}</span></div>
    </article>`;
  });
  html+=`</section>`;
  document.getElementById('app').innerHTML=html;
  renderNav();
}
function renderNav(){
  document.getElementById('nav').innerHTML=D.days.map((d,i)=>`<a href="#day-${i+1}">D${i+1} ${esc(d.date)}</a>`).join('');
}
document.getElementById('search').addEventListener('input',e=>render(e.target.value));
render();
</script>
</body>
</html>
